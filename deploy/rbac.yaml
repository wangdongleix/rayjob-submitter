apiVersion: v1
kind: Namespace
metadata:
  name: ci-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rayjob-submitter
  namespace: ci-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rayjob-submitter
  namespace: ray
rules:
  - apiGroups: ["ray.io"]
    resources:
      - rayjobs
    verbs:
      - get
      - list
      - create
      - delete
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - list
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rayjob-submitter-self-access-review
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources:
      - selfsubjectaccessreviews
    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rayjob-submitter
  namespace: ray
subjects:
  - kind: ServiceAccount
    name: rayjob-submitter
    namespace: ci-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rayjob-submitter

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rayjob-submitter-self-access-review
subjects:
  - kind: ServiceAccount
    name: rayjob-submitter
    namespace: ci-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rayjob-submitter-self-access-review
