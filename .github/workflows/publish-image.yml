name: Publish Docker image

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (defaults to the selected Git tag or sha-<commit>)'
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE: quay.io/albert54/rayjob-submitter

jobs:
  publish:
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Tag pushes have no branch filter; check the commit's ancestry explicitly.
      - name: Verify commit is on main
        shell: bash
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::The selected commit must be reachable from main.'
            exit 1
          fi

      - name: Select image tag
        id: image
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          elif [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="sha-$(git rev-parse HEAD)"
          fi

          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::The image tag must be a valid Docker tag (1-128 letters, digits, underscores, dots or hyphens; no leading dot or hyphen).'
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: albert54+cisystem
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # Avoid showing an unknown/unknown attestation entry in Quay.
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
